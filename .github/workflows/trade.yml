name: Halal Trading Agent

on:
  schedule:
    # كل ساعة طوال جلسة السوق الأمريكي (الإثنين–الجمعة)، شتاءً وصيفاً:
    # 13:45 إلى 20:45 UTC = 4:45 مساءً إلى 11:45 ليلاً بتوقيت الرياض.
    # إذا كان السوق مغلقاً يخرج فوراً. الشراء وإعادة التوازن مرة واحدة يومياً،
    # وفحص وقف الخسارة في كل ساعة.
    - cron: "45 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة بدون أوامر؟"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: pip install pytest && python -m pytest -q

      - name: Run agent
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m agent.main --dry-run
          else
            python -m agent.main
          fi

      - name: Save trade log
        if: always()
        run: |
          git config user.name "halal-trading-agent"
          git config user.email "actions@users.noreply.github.com"
          git add trades.csv latest_report.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Daily report $(date -u +%Y-%m-%d)"
            git push
          fi
