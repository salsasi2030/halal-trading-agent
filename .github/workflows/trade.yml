name: Halal Trading Agent

on:
  schedule:
    # ثلاث محاولات يومياً (الإثنين–الجمعة) لأن GitHub قد يؤخر الجدول ساعات.
    # الوكيل ينفّذ مرة واحدة فقط في اليوم ويتجاهل المحاولات التالية.
    # 14:50 / 16:50 / 18:50 UTC = 5:50 / 7:50 / 9:50 مساءً بتوقيت الرياض
    - cron: "50 14 * * 1-5"
    - cron: "50 16 * * 1-5"
    - cron: "50 18 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة بدون أوامر؟"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: pip install pytest && python -m pytest -q

      - name: Run agent
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m agent.main --dry-run
          else
            python -m agent.main
          fi

      - name: Save trade log
        if: always()
        run: |
          git config user.name "halal-trading-agent"
          git config user.email "actions@users.noreply.github.com"
          git add trades.csv latest_report.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Daily report $(date -u +%Y-%m-%d)"
            git push
          fi
